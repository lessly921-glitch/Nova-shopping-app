
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA STORE</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #171717;
}

header {
  background: #111827;
  color: white;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h2 {
  margin: 0;
  letter-spacing: 2px;
}

.hero {
  background: #202b3c;
  color: white;
  padding: 45px 22px;
}

.hero h1 {
  font-size: 36px;
  margin: 0 0 10px;
}

button {
  background: #e11d48;
  color: white;
  border: 0;
  padding: 12px 18px;
  border-radius: 8px;
  cursor: pointer;
}

main {
  padding: 20px;
}

.products {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.product {
  background: white;
  padding: 12px;
  border-radius: 12px;
}

.photo {
  background: #e5e7eb;
  height: 125px;
  display: grid;
  place-items: center;
  font-size: 55px;
  border-radius: 9px;
}

.price {
  font-weight: bold;
  margin: 8px 0;
}

#cart {
  background: white;
  padding: 18px;
  border-radius: 12px;
  margin-top: 25px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #666;
}
</style>
</head>

<body>

<header>
  <h2>NOVA STORE</h2>
  <span>🛍️ Cart: <b id="count">0</b></span>
</header>

<section class="hero">
  <h1>Find your style.</h1>
  <p>Discover products picked for you.</p>
  <button onclick="document.getElementById('shop').scrollIntoView()">
    Shop Now
  </button>
</section>

<main>
  <h2 id="shop">Featured Products</h2>

  <div class="products" id="products"></div>

  <section id="cart">
    <h2>Your Shopping Cart</h2>
    <div id="items">Your cart is empty.</div>
    <h3>Total: KSh <span id="total">0</span></h3>

    <button onclick="alert('Contact the store owner to arrange your order!')">
      Place Order
    </button>
  </section>
</main>

<footer>
  © 2026 NOVA STORE. All rights reserved.
</footer>

<script>
const products = [
  {name:"Black Hoodie", price:2500, emoji:"🧥"},
  {name:"White Sneakers", price:3500, emoji:"👟"},
  {name:"Classic Watch", price:1800, emoji:"⌚"},
  {name:"Backpack", price:2200, emoji:"🎒"}
];

let cart = [];

const productArea = document.getElementById("products");

products.forEach((p, i) => {
  productArea.innerHTML += `
    <div class="product">
      <div class="photo">${p.emoji}</div>
      <h3>${p.name}</h3>
      <div class="price">KSh ${p.price.toLocaleString()}</div>
      <button onclick="addToCart(${i})">Add to Cart</button>
    </div>
  `;
});

function addToCart(index) {
  cart.push(products[index]);
  updateCart();
}

function updateCart() {
  document.getElementById("count").textContent = cart.length;

  document.getElementById("items").innerHTML =
    cart.length
    ? cart.map(p => `<p>${p.name} — KSh ${p.price.toLocaleString()}</p>`).join("")
    : "Your cart is empty.";

  const total = cart.reduce((sum, p) => sum + p.price, 0);

  document.getElementById("total").textContent =
    total.toLocaleString();
}
</script>

</body>
</html>
